<div class="timeline-page">
  <div class="page-header">
    <h1 class="page-title">My Story</h1>
    <p class="page-subtitle" *ngIf="currentTab === 'timeline'">Education and experience, in order.</p>
    <p class="page-subtitle" *ngIf="currentTab === 'stack'">The languages, frameworks, and tools I work with.</p>

    <div class="tabs-control">
      <button type="button" class="chip" [class.active]="currentTab === 'timeline'"
        [attr.aria-pressed]="currentTab === 'timeline'" (click)="setTab('timeline')">Timeline</button>
      <button type="button" class="chip" [class.active]="currentTab === 'stack'"
        [attr.aria-pressed]="currentTab === 'stack'" (click)="setTab('stack')">My Stack</button>
    </div>
  </div>

  <ol class="timeline-container" *ngIf="currentTab === 'timeline'">
    <li *ngFor="let entry of timelineData; let i = index" class="timeline-node" [appReveal]="i + 1">
      <article class="node-entry">
        <span class="date-text">{{ entry.date }}</span>
        <div class="node-body">
          <img [src]="entry.image" alt="" width="48" height="48" class="timeline-image"
            onerror="this.src='images/websiteintro.jpeg'" />
          <h2>{{ entry.title }}</h2>
          <p class="node-desc">{{ entry.description }}</p>
        </div>
      </article>
    </li>
  </ol>

  <div class="stack-container" *ngIf="currentTab === 'stack'">
    <section class="stack-category" *ngFor="let group of stackGroups" [attr.aria-labelledby]="group.id">
      <h3 [id]="group.id"><i [class]="group.icon" aria-hidden="true"></i> {{ group.title }}</h3>
      <ul class="hex-grid">
        <li class="hex-skill" *ngFor="let item of group.items; let i = index" [appReveal]="i + 1">
          <div class="hex-inner">
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.name }}</span>
          </div>
        </li>
      </ul>
    </section>
  </div>
</div>
