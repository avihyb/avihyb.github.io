<div class="main-layout">
  <!-- Route-change loader: the wordmark, with the dot bouncing while the next page arrives. -->
  <div class="loader" [class.on]="loading" aria-live="polite" [attr.aria-hidden]="!loading">
    <span class="loader-mark" aria-hidden="true">Avichai<span class="loader-dot"></span></span>
    @if (loading) { <span class="sr-only">Loading</span> }
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" [class.scrolled]="scrolled">
    <a class="brand" href="/home" (click)="onBrandClick($event)" aria-label="Avichai Ben David, home">Avichai<span class="brand-dot">.</span></a>
    <nav class="site-nav" aria-label="Primary">
      <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>

      <div class="nav-item">
        <a class="nav-link" routerLink="/projects" routerLinkActive="active" aria-haspopup="true">Projects</a>
        <div class="menu" role="group" aria-label="Projects">
          <a routerLink="/projects" [queryParams]="{tab: 'personal', project: 'bambi-marketplace'}">Bambi</a>
          <a routerLink="/projects" [queryParams]="{tab: 'personal', project: 'filmingitall'}">Filming It All</a>
          <a routerLink="/projects" [queryParams]="{tab: 'personal', project: 'climate-support'}">Climate Support</a>
          <span class="menu-rule" aria-hidden="true"></span>
          <a routerLink="/projects" [queryParams]="{tab: 'academic'}">Academic work</a>
        </div>
      </div>

      <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
  </header>

  <main id="main" class="content-area" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
